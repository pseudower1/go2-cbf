# ---- CBF safety filter ----
# Virtual circular keep-out zone in the odometry (world) frame. The filter
# minimally edits the velocity command so the body (x,y) cannot enter it.
# Position comes from rt/sportmodestate; yaw from the IMU.
cbf_enable: true
cbf_cx: 1.1
cbf_cy: -0.9
cbf_r: 0.7
cbf_margin: 0.4
cbf_gamma: 2.0

# ---- autonomous go-around navigation (matches the sim go-around) ----
cbf_nav: true
cbf_goal_x: 2.8
cbf_goal_y: -1.9
cbf_vdes: 0.5
cbf_band: 0.8
cbf_kw: 1.5
cbf_wmax: 1.0
cbf_goal_tol: 0.2
