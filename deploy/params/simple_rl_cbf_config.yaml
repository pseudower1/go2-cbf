# ---- CBF safety filter ----
# Virtual circular keep-out zone in the odometry (world) frame. The filter
# minimally edits the velocity command so the body (x,y) cannot enter it.
# Position comes from rt/sportmodestate; yaw from the IMU.
cbf_enable: true
cbf_cx: 2.0      # zone center x [m] (ahead of the start)
cbf_cy: 0.0      # zone center y [m]
cbf_r: 0.5       # zone radius [m]
cbf_margin: 0.6   # robot bounding radius 0.39 + buffer -> whole body stays out of r=0.5 zone
cbf_gamma: 2.0   # class-K gain alpha(h)=gamma*h
